name: Update action scripts following upstream

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
#  push:
#    branches: [ main ]

jobs:
  update_and_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_PAT }}

      - name: Install yq (YAML Processor)
        id: install_yq
        run: |
          # Install yq (Go version) for safe and structural YAML manipulation
          YQ_VERSION="v4.44.1"
          echo "Installing yq version $YQ_VERSION..."
          curl -sL https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64 -o yq
          chmod +x yq
          sudo mv yq /usr/local/bin/yq
          echo "yq installed."

      # --- Sync from ophub repo ---

      - name: Checkout ophub repo
        uses: actions/checkout@v7
        with:
          repository: 'ophub/amlogic-s9xxx-armbian'
          ref: 'main'
          path: upstream
          
      # --- Retain this sync workflow ---
      
      - name: Overwrite with rsync
        run: |
          rsync -av --exclude='.git' --exclude='.github/workflows/sync-scripts.yml' --exclude='README.md' upstream/ .
          rm -rf upstream

      # --- Processing for .github/workflows/build-armbian-using-releases-files.yml ---

      - name: Modify Kernel Default in build-armbian-using-releases-files.yml
        id: modify_repack_action
        run: |
          NEW_VALUE='6.1.y_6.12.y'
          TARGET_PATH='.on.workflow_dispatch.inputs.armbian_kernel.default'
          
          echo "Replacing value at path: $TARGET_PATH with '$NEW_VALUE' in build-armbian-using-releases-files.yml"
          # Use yq to precisely target the 'default' key under 'armbian_kernel' input
          yq -i "$TARGET_PATH = \"$NEW_VALUE\"" .github/workflows/build-armbian-using-releases-files.yml
          
          echo "Modification complete."

      # --- Processing for .github/workflows/build-armbian-arm64-server-image.yml ---

      - name: Modify Kernel Default in build.yml
        id: modify_build_action
        run: |
          NEW_VALUE='trixie'
          TARGET_PATH='.on.workflow_dispatch.inputs.set_release.default'          
          echo "Replacing value at path: $TARGET_PATH with '$NEW_VALUE' in build-armbian-arm64-server-image.yml"
          yq -i "$TARGET_PATH = \"$NEW_VALUE\"" .github/workflows/build-armbian-arm64-server-image.yml          
          echo "Target OS Release default modification complete."
          
          NEW_VALUE='wxy-oect'
          TARGET_PATH='.on.workflow_dispatch.inputs.armbian_board.default'          
          echo "Replacing value at path: $TARGET_PATH with '$NEW_VALUE' in build-armbian-arm64-server-image.yml"
          yq -i "$TARGET_PATH = \"$NEW_VALUE\"" .github/workflows/build-armbian-arm64-server-image.yml          
          echo "Target board default modification complete."
          
          NEW_VALUE='6.1.y_6.12.y'
          TARGET_PATH='.on.workflow_dispatch.inputs.armbian_kernel.default'          
          echo "Replacing value at path: $TARGET_PATH with '$NEW_VALUE' in build-armbian-arm64-server-image.yml"
          yq -i "$TARGET_PATH = \"$NEW_VALUE\"" .github/workflows/build-armbian-arm64-server-image.yml          
          echo "Kernel default modification complete."
          
          NEW_VALUE='btrfs'
          TARGET_PATH='.on.workflow_dispatch.inputs.armbian_fstype.default'          
          echo "Replacing value at path: $TARGET_PATH with '$NEW_VALUE' in build-armbian-arm64-server-image.yml"
          yq -i "$TARGET_PATH = \"$NEW_VALUE\"" .github/workflows/build-armbian-arm64-server-image.yml          
          echo "File system default modification complete."

      - name: Append Btrfs to Release Body in build-armbian-arm64-server-image.yml
        id: modify_build_body
        run: |
          # This command uses a structural filter to find the 'release-action' step
          # and appends the new text to its 'body' field.
          APPEND_TEXT="\n### File System\n- Btrfs"
          
          echo "Appending body content to the release step..."
          
          yq -i "(.jobs[].steps[] | select(.name == \"Upload Rebuild image to Release\").with.body) += \"${APPEND_TEXT}\"" .github/workflows/build-armbian-arm64-server-image.yml
          
          echo "Body appending complete and precise."

      - name: Commit and Push Changes (Both Files)
        id: commit
        run: |
          # Check for changes in both target files
          if git diff --exit-code ; then
            echo "No changes found in files. Skipping commit."
          else
            echo "Changes detected. Committing and pushing the updated files."
            
            # Configure git identity for the commit
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'

            # Stage the modified files and create a commit
            git add .
            git commit -m "Update following upstream via automation"
            
            # Push the changes back to the current branch
            git push
          fi
